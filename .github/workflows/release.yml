name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build and verify candidate artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.3"
          python-version: "3.14"
      - name: Install locked build and verification dependencies
        run: uv sync --locked --no-dev --extra dev
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify installed artifact without model weights
        run: uv run --locked --no-dev --extra dev python scripts/check_release.py --dist dist --artifact-only | tee release-check.json
      - name: Upload candidate artifacts for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forecast-anything-release-candidate
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-check.json
          if-no-files-found: error
          retention-days: 14
