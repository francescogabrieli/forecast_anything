name: CI

on:
  pull_request:
    branches: [main, "codex/**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space on the GitHub-hosted runner
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra mcp
      - name: Check Python file lengths
        run: uv run --locked --extra dev --extra mcp python scripts/check_python_file_lengths.py
      - name: Lint Python
        run: uv run --locked --extra dev --extra mcp ruff check src tests scripts
      - name: Check Python formatting
        run: uv run --locked --extra dev --extra mcp ruff format --check src tests scripts
      - name: Check exported contract drift
        run: uv run --locked --extra dev --extra mcp python scripts/export_contracts.py contracts/v1 --check
      - name: Check exported console contract drift
        run: uv run --locked --extra dev --extra mcp python scripts/export_contracts.py apps/console/src/api --check
      - name: Check Python types
        run: uv run --locked --extra dev --extra mcp python scripts/check_types.py
      - name: Check CPU forecast accuracy and frozen splits
        env:
          HF_HUB_OFFLINE: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: uv run --locked --extra dev --extra mcp pytest -q tests/unit/test_accuracy_gate.py
      - name: Run tests with branch coverage
        run: uv run --locked --extra dev --extra mcp coverage run -m pytest -q
      - name: Publish Python branch coverage
        if: always()
        run: |
          if compgen -G '.coverage.*' > /dev/null; then
            uv run --locked --extra dev --extra mcp coverage combine
          fi
          if test -f .coverage; then
            echo "## Python ${{ matrix.python-version }} branch coverage" >> "$GITHUB_STEP_SUMMARY"
            uv run --locked --extra dev --extra mcp coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Audit locked Python dependencies (informational)
        if: always()
        continue-on-error: true
        run: |
          echo "## Python dependency audit (informational)" >> "$GITHUB_STEP_SUMMARY"
          echo "The pinned Timestral Git revision is reviewed separately. Its PyPI dependencies are included." >> "$GITHUB_STEP_SUMMARY"
          requirements="$RUNNER_TEMP/forecast-audit-requirements.txt"
          report="$RUNNER_TEMP/forecast-audit.md"
          uv export --locked --group dev --extra mcp --no-emit-project --no-emit-package timestral --no-hashes --output-file "$requirements" --quiet
          audit_status=0
          uv run --locked --extra dev --extra mcp pip-audit --no-deps --disable-pip --progress-spinner off --format markdown --output "$report" --requirement "$requirements" || audit_status=$?
          if test -s "$report"; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          elif test "$audit_status" -eq 0; then
            echo "No known vulnerabilities reported for the scanned dependencies." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Audit produced no report. See the step log." >> "$GITHUB_STEP_SUMMARY"
          fi
          if test "$audit_status" -ne 0; then
            echo "::warning::pip-audit exited with status $audit_status. Review findings, skipped packages and the step log."
          fi
          exit "$audit_status"
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify installed artifact outside checkout (model execution separate)
        run: uv run --locked --extra dev --extra mcp python scripts/check_release.py --dist dist --artifact-only
      - name: Report remaining disk space
        if: always()
        run: df -h / "$RUNNER_TEMP"

  console:
    name: Forecast console (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - name: Install locked console dependencies
        run: npm ci
      - name: Check generated console contracts
        run: npm run check:types
      - name: Typecheck console
        run: npm run typecheck
      - name: Test console
        run: npm test -- --run
      - name: Build console
        run: npm run build
      - name: Set up locked Python runtime for the real API E2E fixture
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: "3.14"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deterministic browser E2E
        run: CI=1 npm run test:e2e
