[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecast-anything"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["src"]
