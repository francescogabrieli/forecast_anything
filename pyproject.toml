[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecast-anything"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.17,<0.18"]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
forecast-anything = "forecast_anything.cli:main"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
