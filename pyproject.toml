[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecast-anything"
version = "0.1.1"
description = "A local forecasting observatory with typed Future Graphs and immutable evidence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "numpy>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3", "httpx>=0.27,<1"]
timestral = ["huggingface-hub>=0.23", "safetensors>=0.4", "torch>=2.4"]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "hypothesis>=6,<7",
    "ruff>=0.17,<0.18",
    "mypy>=1.15,<3",
    "coverage>=7.10,<8",
    "pip-audit>=2.9,<3",
]

[dependency-groups]
dev = ["timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff"]

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["forecast_anything"]
patch = ["subprocess"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
forecast-anything = "forecast_anything.cli:main"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel.force-include]
"examples/minimal" = "forecast_anything/examples/minimal"
"contracts/v1" = "forecast_anything/contracts/v1"
"LICENSE" = "forecast_anything/LICENSE"
"NOTICE" = "forecast_anything/NOTICE"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.local/**",
    "/.superpowers/**",
    "/.agents/**",
    "/.codex/**",
    "/.aws/**",
    "/.venv/**",
    "/venv/**",
    "**/.venv/**",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
    "/.coverage*",
    "**/.coverage*",
    "/htmlcov/**",
    "/work/**",
    "/outputs/**",
    "/dist/**",
    "/docs/research/phase-7-release-readiness.md",
    "**/node_modules/**",
    "**/test-results/**",
    "**/playwright-report/**",
    "**/coverage/**",
    "/apps/console/dist/**",
    "/site/dist/**",
    "/site/.prerender/**",
]

[tool.hatch.build.targets.sdist.force-include]
"examples/minimal" = "examples/minimal"
"contracts/v1" = "contracts/v1"
"LICENSE" = "LICENSE"
"NOTICE" = "NOTICE"
