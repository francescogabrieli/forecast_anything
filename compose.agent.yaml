# Service extends imports the existing, tested process egress policy.
# Compose does not import top-level resources from extends, so networks are below.
services:
  core:
    environment:
      FORECAST_ANYTHING_AGENT_CORE_TOKEN: ${FORECAST_ANYTHING_AGENT_CORE_TOKEN:?Set a distinct agent core token}
    networks:
      - default
      - agent_internal

  worker:
    environment:
      FORECAST_ANYTHING_AGENT_URL: http://agent:3000
      FORECAST_ANYTHING_AGENT_BRIDGE_TOKEN: ${FORECAST_ANYTHING_AGENT_BRIDGE_TOKEN:?Set a distinct agent bridge token}
    networks:
      - default
      - agent_internal
    depends_on:
      agent:
        condition: service_healthy

  agent:
    extends:
      file: ./apps/agent/compose.agent-egress.yaml
      service: agent
    build:
      context: .
      target: agent
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?The agent override requires an OpenAI API key}
      OPENAI_MODEL_ID: ${OPENAI_MODEL_ID:-gpt-6-luna}
      FORECAST_AGENT_BRIDGE_TOKEN: ${FORECAST_ANYTHING_AGENT_BRIDGE_TOKEN:?Set a distinct agent bridge token}
      FORECAST_AGENT_CORE_URL: http://core:8000
      FORECAST_AGENT_CORE_TOKEN: ${FORECAST_ANYTHING_AGENT_CORE_TOKEN:?Set a distinct agent core token}
      FORECAST_AGENT_DATABASE_URL: postgres://world:${FORECAST_AGENT_POSTGRES_PASSWORD:?Set a URL-safe Postgres password}@workflow-postgres:5432/world
      WORKFLOW_POSTGRES_URL: postgres://world:${FORECAST_AGENT_POSTGRES_PASSWORD:?Set a URL-safe Postgres password}@workflow-postgres:5432/world
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: "1"
    depends_on:
      core:
        condition: service_healthy
      workflow-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    init: true
    restart: unless-stopped

  agent-egress-proxy:
    extends:
      file: ./apps/agent/compose.agent-egress.yaml
      service: agent-egress-proxy
    # extends resolves its relative build path from the overlay's directory.
    build:
      context: ./apps/agent/egress-proxy
    init: true
    restart: unless-stopped

  workflow-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: world
      POSTGRES_DB: world
      POSTGRES_PASSWORD: ${FORECAST_AGENT_POSTGRES_PASSWORD:?Set a URL-safe Postgres password}
    networks:
      - agent_internal
    volumes:
      - agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U world -d world"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

networks:
  agent_internal:
    name: forecast-agent-internal
    internal: true
  agent_outbound:
    name: forecast-agent-outbound

volumes:
  agent-postgres:
